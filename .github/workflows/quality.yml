name: Scientific and application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified official tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - name: Type check and production build
        run: npm run build
      - name: Scientific fixtures and API regressions
        run: python -m unittest discover -s tests -v
      - name: Independent real-data numerical validation
        run: python -m scripts.validate_coadd
      - name: Native photometry and calibrated-area validation
        run: python -m scripts.validate_photometry
      - name: Six-detector native extraction validation
        run: python -m scripts.validate_native_extraction
      - name: Retained spectral model fingerprints
        run: python -m scripts.acquire_spectral_fiducials
      - name: Browser-runtime dependency audit
        run: npm audit --omit=dev
